<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyal Invoices | فواتير إيال</title>
<style>
/*__FONTS__*/
:root{
  --bg:#06040F;--bg2:#0C0820;--surface:#110D25;--surface2:#1A1535;--line:rgba(167,139,250,.16);
  --purple:#7C3AED;--purple-l:#A78BFA;--neon:#39FF6E;--neon-dim:rgba(57,255,110,.12);
  --text:#F0EBF8;--muted:rgba(240,235,248,.55);--danger:#FF5C7A;--warn:#FFC857;
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num,.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--bg2);border-inline-end:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand-mark{font-weight:900;font-size:26px;letter-spacing:.5px;background:linear-gradient(135deg,var(--purple-l),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:2px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:11px 12px;border-radius:8px;cursor:pointer;color:var(--muted);text-align:start;transition:.2s}
@media(hover:hover){.nav-btn:hover{background:var(--surface);color:var(--text)}}
.nav-btn.active{background:var(--surface2);color:var(--text);box-shadow:inset -3px 0 0 var(--neon)}
.nav-btn .ic{width:20px;text-align:center;opacity:.9}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--neon);margin-inline-end:6px;box-shadow:0 0 8px var(--neon)}
main{padding:28px 32px 60px;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:26px;font-weight:900}
h2{font-size:17px;font-weight:700;margin-bottom:14px}
.sub{color:var(--muted);font-size:13px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--purple-l)}
.btn.primary{background:linear-gradient(135deg,var(--purple),#A855F7);border-color:transparent;color:#fff}
.btn.primary:hover{box-shadow:0 0 24px rgba(124,58,237,.5)}
.btn.neon{background:var(--neon);color:#06040F;border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(255,92,122,.35);background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--purple-l);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card+.card{margin-top:16px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi .k-label{font-size:12.5px;color:var(--muted)}
.kpi .k-val{font-size:24px;font-weight:900;margin-top:6px}
.kpi .k-val small{font-size:12px;font-weight:500;color:var(--muted)}
.kpi.accent{border-color:rgba(57,255,110,.35);background:linear-gradient(160deg,rgba(57,255,110,.07),var(--surface) 60%)}
.kpi.warn .k-val{color:var(--warn)}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:500;color:var(--muted);font-size:12px;text-align:start;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid rgba(167,139,250,.08);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:rgba(124,58,237,.07)}
.pill{display:inline-block;padding:3px 10px;border-radius:50px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.paid,.pill.accepted{background:var(--neon-dim);color:var(--neon)}
.pill.unpaid,.pill.pending{background:rgba(255,200,87,.12);color:var(--warn)}
.pill.overdue,.pill.rejected{background:rgba(255,92,122,.12);color:var(--danger)}
.pill.cancelled,.pill.draft{background:rgba(240,235,248,.08);color:var(--muted)}
.pill.type{background:rgba(124,58,237,.18);color:var(--purple-l)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* ---------- editor ---------- */
.editor{display:grid;grid-template-columns:minmax(380px,1fr) auto;gap:22px;align-items:start}
.items-edit{display:flex;flex-direction:column;gap:8px}
.item-row{display:grid;grid-template-columns:1fr 70px 110px 100px 34px;gap:8px;align-items:start}
.item-row textarea{min-height:40px;height:40px;overflow:hidden}
.item-row .amt{padding:10px 4px;text-align:end;font-weight:700}
.item-head{font-size:12px;color:var(--muted);padding:0 2px}
.x{background:none;border:1px solid var(--line);border-radius:8px;height:40px;cursor:pointer;color:var(--muted)}
.x:hover{color:var(--danger);border-color:var(--danger)}
.totals-mini{margin-top:14px;display:grid;gap:6px;font-size:14px}
.totals-mini div{display:flex;justify-content:space-between}
.totals-mini .grand{font-size:18px;font-weight:900;color:var(--neon);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.preview-col{position:sticky;top:20px}
.preview-frame{zoom:.62;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:4px;overflow:hidden}
.preview-tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}

/* ---------- misc ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--neon);color:var(--text);padding:12px 22px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:99;box-shadow:0 0 30px rgba(57,255,110,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.3);color:var(--warn);padding:12px 16px;border-radius:var(--r);margin-bottom:18px;font-size:14px;flex-wrap:wrap}
.logo-prev{width:120px;height:70px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.search{max-width:260px}
.modal-bg{position:fixed;inset:0;background:rgba(6,4,15,.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}

/* =========================================================
   PAPER  (the printed document — white, brand accents)
   ========================================================= */
.paper{width:210mm;min-height:297mm;background:#fff;color:#1b1530;font-family:'Tajawal',sans-serif;font-size:12.5px;line-height:1.55;padding:14mm 14mm 12mm;position:relative;display:flex;flex-direction:column}
.paper .bar{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#39FF6E,#7C3AED 45%,#4C1D95)}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:12px;border-bottom:1px solid #ece8f6}
.p-co{display:flex;gap:14px;align-items:center}
.p-logo{max-height:60px;max-width:150px;object-fit:contain}
.p-word{font-weight:900;font-size:30px;color:#4C1D95;letter-spacing:.5px;line-height:1}
.p-word span{display:block;font-size:10px;letter-spacing:3px;color:#7C3AED;margin-top:4px;font-weight:500}
.p-co-info{font-size:11px;color:#5b5470;line-height:1.6}
.p-co-info b{color:#1b1530;font-size:13px}
.p-title{text-align:end}
.p-title .t-ar{font-size:22px;font-weight:900;color:#4C1D95}
.p-title .t-en{font-size:11px;letter-spacing:3px;color:#7C3AED;font-weight:700;text-transform:uppercase}
.p-title .no{margin-top:6px;display:inline-block;background:#f3efff;color:#4C1D95;padding:3px 10px;border-radius:4px;font-weight:700;direction:ltr}
.p-meta{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin:14px 0}
.p-box{border:1px solid #ece8f6;border-radius:6px;padding:10px 12px}
.p-box h4{font-size:10.5px;color:#7C3AED;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.p-box h4 em{font-style:normal;letter-spacing:1.5px;font-size:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px}
.kv dt{color:#7a7390}
.kv dd{font-weight:500}
.cl-name{font-size:14px;font-weight:700;margin-bottom:3px}
table.p-items{width:100%;border-collapse:collapse;margin-top:4px}
table.p-items th{background:#1b1530;color:#fff;font-weight:500;font-size:10.5px;padding:7px 8px;text-align:start;line-height:1.3}
table.p-items th small{display:block;font-size:8.5px;letter-spacing:1px;opacity:.7}
table.p-items th:first-child{border-start-start-radius:5px}
table.p-items th:last-child{border-start-end-radius:5px}
table.p-items td{padding:8px;border-bottom:1px solid #ece8f6;vertical-align:top;font-size:11.5px}
table.p-items tr:nth-child(even) td{background:#faf9fd}
table.p-items .c{text-align:center}
table.p-items .e{text-align:end;white-space:nowrap}
.desc{white-space:pre-wrap}
.p-bottom{display:grid;grid-template-columns:1fr 78mm;gap:16px;margin-top:14px;align-items:start}
.p-totals{border:1px solid #ece8f6;border-radius:6px;overflow:hidden}
.p-totals div{display:flex;justify-content:space-between;padding:6px 12px;font-size:11.5px;border-bottom:1px solid #f1eef8}
.p-totals div span:first-child small{display:block;font-size:8.5px;color:#9a93ad;letter-spacing:.5px}
.p-totals .g{background:#4C1D95;color:#fff;font-weight:900;font-size:14px;border:0;padding:9px 12px}
.p-totals .g small{color:#d9ccff!important}
.p-words{background:#f6f3ff;border-inline-start:3px solid #7C3AED;padding:8px 12px;border-radius:4px;font-size:11.5px;margin-bottom:10px}
.p-words b{color:#4C1D95}
.p-bank{display:flex;gap:12px;align-items:flex-start}
.p-qr{width:30mm;height:30mm;flex:none}
.p-qr svg,.p-qr img{width:100%;height:100%;display:block}
.p-notes{margin-top:12px;font-size:11px;color:#4a4360;white-space:pre-wrap}
.p-notes h5{font-size:10.5px;color:#7C3AED;margin-bottom:3px}
.p-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:auto;padding-top:22px}
.p-sign div{border-top:1px dashed #cfc8e3;padding-top:6px;font-size:10.5px;color:#7a7390;text-align:center}
.p-foot{margin-top:14px;padding-top:8px;border-top:1px solid #ece8f6;display:flex;justify-content:space-between;font-size:10px;color:#8a83a0;gap:10px;flex-wrap:wrap}
.p-foot .acc{color:#16a34a;font-weight:700}
.p-stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:64px;font-weight:900;letter-spacing:6px;opacity:.09;pointer-events:none;white-space:nowrap}
.p-stamp.paid{color:#16a34a}.p-stamp.cancelled{color:#dc2626}

/* ---------- print ---------- */
#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;height:auto}
  .app,.toast,.modal-bg{display:none!important}
  #printArea{display:block}
  .paper{box-shadow:none;min-height:296mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- responsive ---------- */
@media(max-width:1250px){.editor{grid-template-columns:1fr}.preview-col{position:static}.preview-frame{zoom:.55;width:max-content;margin-inline:auto}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;z-index:10;border-inline-end:0;border-bottom:1px solid var(--line)}
  .brand,.side-foot{display:none}
  .nav-btn{width:auto;white-space:nowrap;padding:9px 12px}
  .nav-btn.active{box-shadow:inset 0 -2px 0 var(--neon)}
  main{padding:20px 16px 60px}
  .kpis{grid-template-columns:1fr 1fr}
  .dash-grid,.grid2,.grid3{grid-template-columns:1fr}
  .item-row{grid-template-columns:1fr 60px 90px 34px}
  .item-row .amt{display:none}
  .preview-frame{zoom:.42}
}
</style>

<div class="app">

    <div class="brand"><div><div class="brand-mark">EYAL</div><small>INVOICES · فواتير</small></div></div>

    <button class="nav-btn" data-view="settings"><span class="ic">⚙</span>الإعدادات</button>

<script>
/*__QRCODE__*/
</script>
<script>
'use strict';
/* =========================================================
   STORE
   ========================================================= */
const KEY = 'eyal-invoices-v1';
const DEFAULT_SETTINGS = {
  nameAr:'إيال لإدارة الفعاليات', nameEn:'Eyal Event Management',
  vatNo:'', crNo:'', addressAr:'المملكة العربية السعودية', addressEn:'Kingdom of Saudi Arabia',
  phone:'+966 50 363 8810', email:'info@eyalentertainment.com', website:'eyalentertainment.com',
  bank:'', iban:'', accountName:'', logo:'',
  vatRate:15, invPrefix:'INV-', quotePrefix:'QT-', nextInv:1, nextQuote:1, dueDays:14, quoteValidDays:15,
  invTerms:'يُرجى السداد خلال المدة المحددة عبر التحويل البنكي مع ذكر رقم الفاتورة.',
  quoteTerms:'العرض ساري لمدة 15 يومًا من تاريخه.\nيتم تأكيد الحجز بدفعة مقدمة 50% والباقي قبل يوم الفعالية.\nأي إضافات خارج النطاق تُسعّر بشكل منفصل.'
};
let DB = load();
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY)||'null');
    if(d && d.settings) { d.settings = {...DEFAULT_SETTINGS, ...d.settings}; d.clients ||= []; d.docs ||= []; return d; }
  }catch(e){}
  return {settings:{...DEFAULT_SETTINGS}, clients:[], docs:[], lastBackup:null};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('⚠️ تعذّر الحفظ — المساحة ممتلئة. صغّر حجم الشعار أو خذ نسخة احتياطية.'); }
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const S = () => DB.settings;

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n||0)*100)/100;
const money = n => (+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+(+n||0)); return d.toISOString().slice(0,10); };
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '—';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

function calc(doc){
  const sub = r2(doc.items.reduce((a,it)=>a + r2((+it.qty||0)*(+it.price||0)),0));
  const disc = Math.min(r2(doc.discount), sub);
  const taxable = r2(sub - disc);
  const vat = r2(taxable * (+doc.vatRate||0)/100);
  return {sub, disc, taxable, vat, total:r2(taxable+vat)};
}
function docStatus(doc){
  if(doc.type==='invoice' && doc.status==='unpaid' && doc.due && doc.due < today()) return 'overdue';
  return doc.status;
}
const STATUS_LABEL = {paid:'مدفوعة',unpaid:'غير مدفوعة',overdue:'متأخرة',cancelled:'ملغاة',pending:'بانتظار الرد',accepted:'مقبول',rejected:'مرفوض'};
const TYPE_LABEL = {invoice:'فاتورة',quote:'عرض سعر'};

/* ---------- Arabic amount in words (تفقيط) ---------- */
function arWords(n){
  n = Math.floor(n);
  if(n===0) return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const below1000 = x => {
    const parts=[]; const h=Math.floor(x/100), rest=x%100;
    if(h) parts.push(hund[h]);
    if(rest){ if(rest<20) parts.push(ones[rest]); else { const o=rest%10,t=Math.floor(rest/10); parts.push(o? ones[o]+' و'+tens[t] : tens[t]); } }
    return parts.join(' و');
  };
  const scales=[ ['ألف','ألفان','آلاف'], ['مليون','مليونان','ملايين'], ['مليار','ملياران','مليارات'] ];
  const groups=[]; let x=n; while(x>0){ groups.push(x%1000); x=Math.floor(x/1000); }
  const out=[];
  for(let i=groups.length-1;i>=0;i--){
    const g=groups[i]; if(!g) continue;
    if(i===0){ out.push(below1000(g)); continue; }
    const [one,two,plural]=scales[i-1];
    if(g===1) out.push(one);
    else if(g===2) out.push(two);
    else if(g>=3&&g<=10) out.push(below1000(g)+' '+plural);
    else out.push(below1000(g)+' '+one);
  }
  return out.join(' و');
}
function amountWords(total){
  const sar=Math.floor(r2(total)), hal=Math.round((r2(total)-sar)*100);
  let s='فقط '+arWords(sar)+' ريال سعودي';
  if(hal) s+=' و'+arWords(hal)+' هللة';
  return s+' لا غير';
}

/* ---------- ZATCA (Phase 1) QR — TLV base64 ---------- */
function zatcaTLV(fields){
  const enc=new TextEncoder(); const bytes=[];
  fields.forEach((v,i)=>{ const b=enc.encode(String(v)); bytes.push(i+1, b.length, ...b); });
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin);
}
function qrSvg(text){
  const q=qrcode(0,'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:4, margin:2, scalable:true});
}

function docTitle(doc){
  if(doc.type==='quote') return {ar:'عرض سعر', en:'Quotation'};
  if(!S().vatNo || !(+doc.vatRate)) return {ar:'فاتورة', en:'Invoice'};
  return doc.client?.vat ? {ar:'فاتورة ضريبية', en:'Tax Invoice'} : {ar:'فاتورة ضريبية مبسطة', en:'Simplified Tax Invoice'};
}
function renderPaper(doc){
  const s=S(), c=calc(doc), cl=doc.client||{}, t=docTitle(doc), isInv=doc.type==='invoice';
  const st=docStatus(doc);
  const logo = s.logo ? `<img class="p-logo" src="${s.logo}" alt="">` : `<div class="p-word">EYAL<span>إيال · EVENTS</span></div>`;
  const items = doc.items.filter(it=>it.desc||+it.price).map((it,i)=>`
    <tr><td class="c">${i+1}</td><td class="desc">${esc(it.desc)}</td><td class="c num">${+it.qty||0}</td>
    <td class="e num">${money(it.price)}</td><td class="e num">${money(r2((+it.qty||0)*(+it.price||0)))}</td></tr>`).join('')
    || `<tr><td colspan="5" class="c" style="color:#aaa;padding:20px">— أضف البنود —</td></tr>`;
  let qr='';
  if(isInv && s.vatNo){
    const ts = new Date((doc.date||today())+'T'+(doc.time||'12:00:00')).toISOString();
    qr = `<div class="p-qr">${qrSvg(zatcaTLV([s.nameAr||s.nameEn, s.vatNo, ts, c.total.toFixed(2), c.vat.toFixed(2)]))}</div>`;
  }
  const bank = (s.bank||s.iban) ? `<div class="p-box" style="flex:1"><h4>بيانات التحويل <em>BANK DETAILS</em></h4><dl class="kv">
      ${s.accountName?`<dt>اسم الحساب</dt><dd>${esc(s.accountName)}</dd>`:''}
      ${s.bank?`<dt>البنك</dt><dd>${esc(s.bank)}</dd>`:''}

  const metaRows = isInv
    ? `<dt>تاريخ الإصدار</dt><dd class="num" style="text-align:start">${fmtDate(doc.date)}</dd>
       <dt>تاريخ الاستحقاق</dt><dd class="num" style="text-align:start">${fmtDate(doc.due)}</dd>
       ${doc.ref?`<dt>مرجع عرض السعر</dt><dd class="num" style="text-align:start">${esc(doc.ref)}</dd>`:''}`
    : `<dt>تاريخ العرض</dt><dd class="num" style="text-align:start">${fmtDate(doc.date)}</dd>
       <dt>صالح حتى</dt><dd class="num" style="text-align:start">${fmtDate(doc.due)}</dd>`;
  return `<div class="paper">
    <div class="bar"></div>${stamp}
    <div class="p-head">
      <div class="p-co">${logo}
        <div class="p-co-info"><b>${esc(s.nameAr)}</b><br>${esc(s.nameEn)}<br>
          ${s.vatNo?`الرقم الضريبي VAT: <span class="ltr">${esc(s.vatNo)}</span><br>`:''}
          ${s.crNo?`السجل التجاري CR: <span class="ltr">${esc(s.crNo)}</span>`:''}</div>
      </div>
      <div class="p-title"><div class="t-ar">${t.ar}</div><div class="t-en">${t.en}</div><div class="no">${esc(doc.number)}</div></div>
    </div>
    <div class="p-meta">
      <div class="p-box"><h4>${isInv?'فاتورة إلى':'مقدّم إلى'} <em>${isInv?'BILL TO':'PREPARED FOR'}</em></h4>
        <div class="cl-name">${esc(cl.name)||'—'}</div>
        <dl class="kv">
          ${cl.vat?`<dt>الرقم الضريبي</dt><dd class="ltr" style="text-align:start">${esc(cl.vat)}</dd>`:''}
          ${cl.cr?`<dt>السجل التجاري</dt><dd class="ltr" style="text-align:start">${esc(cl.cr)}</dd>`:''}
          ${cl.address?`<dt>العنوان</dt><dd>${esc(cl.address)}</dd>`:''}
          ${cl.phone?`<dt>الجوال</dt><dd class="ltr" style="text-align:start">${esc(cl.phone)}</dd>`:''}
        </dl></div>
      <div class="p-box"><h4>التفاصيل <em>DETAILS</em></h4><dl class="kv">${metaRows}
        ${doc.event?`<dt>الفعالية / المشروع</dt><dd>${esc(doc.event)}</dd>`:''}
        ${doc.eventDate?`<dt>تاريخ الفعالية</dt><dd class="num" style="text-align:start">${fmtDate(doc.eventDate)}</dd>`:''}</dl></div>
    </div>
    <table class="p-items">
      <thead><tr><th class="c" style="width:7%">#</th><th>الوصف<small>DESCRIPTION</small></th><th class="c" style="width:9%">الكمية<small>QTY</small></th>
      <th class="e" style="width:16%">سعر الوحدة<small>UNIT PRICE</small></th><th class="e" style="width:17%">المبلغ<small>AMOUNT</small></th></tr></thead>
      <tbody>${items}</tbody>
    </table>
    <div class="p-bottom">
      <div>
        <div class="p-words"><b>المبلغ كتابةً:</b> ${amountWords(c.total)}</div>
        <div class="p-bank">${bank}${qr}</div>
      </div>
      <div class="p-totals">
        <div><span>المجموع<small>SUBTOTAL</small></span><span class="num">${money(c.sub)}</span></div>
        ${c.disc?`<div><span>الخصم<small>DISCOUNT</small></span><span class="num">- ${money(c.disc)}</span></div>
        <div><span>الإجمالي الخاضع للضريبة<small>TAXABLE AMOUNT</small></span><span class="num">${money(c.taxable)}</span></div>`:''}
        ${+doc.vatRate?`<div><span>ضريبة القيمة المضافة ${+doc.vatRate}%<small>VAT</small></span><span class="num">${money(c.vat)}</span></div>`:''}
        <div class="g"><span>الإجمالي ${+doc.vatRate?'شامل الضريبة':''}<small>TOTAL (SAR)</small></span><span class="num">${money(c.total)} ر.س</span></div>
      </div>
    </div>
    ${doc.notes?`<div class="p-notes"><h5>الشروط والملاحظات · Terms & Notes</h5>${esc(doc.notes)}</div>`:''}
    <div class="p-sign"><div>${isInv?'الختم والتوقيع':'اعتماد إيال'}<br>Stamp & Signature</div><div>${isInv?'استلام العميل':'موافقة العميل'}<br>Client ${isInv?'Receipt':'Approval'}</div></div>
    <div class="p-foot"><span>${esc(s.addressAr)}${s.addressEn?' · '+esc(s.addressEn):''}</span>
      <span class="ltr">${[s.phone,s.email,s.website].filter(Boolean).map(esc).join('  ·  ')}</span>
      <span class="acc">${esc(s.nameEn)}</span></div>
  </div>`;
}

function printDoc(doc){
  $('#printArea').innerHTML = renderPaper(doc);
  const old=document.title; document.title = doc.number + (doc.client?.name ? ' - '+doc.client.name : '');
  setTimeout(()=>{ window.print(); document.title=old; },60);
}

   ROUTER
   ========================================================= */
let current = {view:'dash'};
function go(view, arg){
  current = {view, arg};
  $$('.nav-btn').forEach(b=>b.classList.toggle('active', !!(b.dataset.view===view || (view==='edit' && arg?.isNew && b.dataset.new===arg.type))));
  const m=$('#main'); m.innerHTML='';
  ({dash:viewDash, docs:viewDocs, clients:viewClients, settings:viewSettings, edit:viewEdit})[view](m,arg);
  window.scrollTo(0,0);
  updateBackupLabel();
}
$$('.nav-btn').forEach(b=>b.onclick=()=> b.dataset.new ? go('edit',{isNew:true,type:b.dataset.new}) : go(b.dataset.view));

function backupBanner(){
  const days = DB.lastBackup ? (Date.now()-DB.lastBackup)/864e5 : Infinity;
  if(DB.docs.length && days>7) return `<div class="banner"><span>⚠️ ${DB.lastBackup?'آخر نسخة احتياطية قبل '+Math.floor(days)+' يوم':'لم تأخذ نسخة احتياطية بعد'} — بياناتك محفوظة في هذا المتصفح فقط.</span><button class="btn sm" onclick="exportBackup()">نسخة احتياطية الآن</button></div>`;
  return '';
}
function updateBackupLabel(){ $('#lastBackup').textContent = DB.lastBackup ? 'آخر نسخة: '+new Date(DB.lastBackup).toLocaleDateString('en-GB') : 'لا توجد نسخة احتياطية'; }

/* ---------- DASHBOARD ---------- */
function viewDash(m){
  const y=new Date().getFullYear(), inv=DB.docs.filter(d=>d.type==='invoice'&&d.status!=='cancelled');
  const yInv=inv.filter(d=>(d.date||'').startsWith(y));
  const sum=(arr,k='total')=>arr.reduce((a,d)=>a+calc(d)[k],0);
  const unpaid=inv.filter(d=>d.status==='unpaid'), overdue=unpaid.filter(d=>docStatus(d)==='overdue');
  const q=Math.floor(new Date().getMonth()/3);
  const qInv=yInv.filter(d=>Math.floor((+d.date.slice(5,7)-1)/3)===q);
  const quotes=DB.docs.filter(d=>d.type==='quote'&&d.status==='pending');
  const quarters=[0,1,2,3].map(i=>{const a=yInv.filter(d=>Math.floor((+d.date.slice(5,7)-1)/3)===i);return{i,n:a.length,taxable:sum(a,'taxable'),vat:sum(a,'vat'),total:sum(a)}});
  m.innerHTML = `
    <div class="page-head"><div><h1>لوحة التحكم</h1><div class="sub">سنة ${y}</div></div>
      <div class="row"><button class="btn" onclick="go('edit',{isNew:true,type:'quote'})">عرض سعر جديد</button><button class="btn primary" onclick="go('edit',{isNew:true,type:'invoice'})">＋ فاتورة جديدة</button></div></div>
    ${backupBanner()}
    <div class="kpis">
      <div class="kpi accent"><div class="k-label">إجمالي المفوتر ${y}</div><div class="k-val num">${money(sum(yInv))} <small>ر.س</small></div></div>
      <div class="kpi"><div class="k-label">المحصّل ${y}</div><div class="k-val num">${money(sum(yInv.filter(d=>d.status==='paid')))} <small>ر.س</small></div></div>
      <div class="kpi ${overdue.length?'warn':''}"><div class="k-label">مستحق التحصيل (${unpaid.length}) ${overdue.length?'· '+overdue.length+' متأخرة':''}</div><div class="k-val num">${money(sum(unpaid))} <small>ر.س</small></div></div>
      <div class="kpi"><div class="k-label">ضريبة الربع الحالي (Q${q+1})</div><div class="k-val num">${money(sum(qInv,'vat'))} <small>ر.س</small></div></div>
    </div>
    <div class="dash-grid">
      <div class="card"><h2>بانتظار التحصيل</h2>${docTable(unpaid.sort((a,b)=>(a.due||'').localeCompare(b.due||'')).slice(0,8),true)}</div>
      <div>
        <div class="card"><h2>ملخص ضريبة القيمة المضافة ${y}</h2><div class="sub" style="margin:-8px 0 12px">جاهز لإقرار الزكاة والضريبة الربعي</div>
          <div class="tbl-wrap"><table class="t"><thead><tr><th>الربع</th><th>فواتير</th><th>المبيعات قبل الضريبة</th><th>الضريبة</th></tr></thead><tbody>
          ${quarters.map(r=>`<tr><td>Q${r.i+1}</td><td class="num">${r.n}</td><td class="num">${money(r.taxable)}</td><td class="num">${money(r.vat)}</td></tr>`).join('')}
          </tbody></table></div></div>
        <div class="card"><h2>عروض أسعار مفتوحة (${quotes.length})</h2>${docTable(quotes.slice(0,5),true)}</div>
      </div>
    </div>`;
}
function docTable(list, compact){
  if(!list.length) return `<div class="empty">لا يوجد شيء هنا بعد</div>`;
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>الرقم</th>${compact?'':'<th>النوع</th>'}<th>العميل</th>${compact?'':'<th>الفعالية</th><th>التاريخ</th>'}<th>${compact?'الاستحقاق':'الاستحقاق'}</th><th>الإجمالي</th><th>الحالة</th></tr></thead><tbody>
    ${list.map(d=>{const st=docStatus(d);return `<tr class="click" onclick="go('edit',{id:'${d.id}'})"><td class="num" style="font-weight:700;white-space:nowrap">${esc(d.number)}</td>${compact?'':`<td><span class="pill type">${TYPE_LABEL[d.type]}</span></td>`}
      <td>${esc(d.client?.name)||'—'}</td>${compact?'':`<td class="muted">${esc(d.event)||''}</td><td class="num">${fmtDate(d.date)}</td>`}<td class="num">${fmtDate(d.due)}</td>
      <td class="num" style="font-weight:700">${money(calc(d).total)}</td><td><span class="pill ${st}">${STATUS_LABEL[st]}</span></td></tr>`}).join('')}
  </tbody></table></div>`;
}

let docFilter={type:'all',q:'',status:'all'};
function viewDocs(m){
  m.innerHTML=`<div class="page-head"><div><h1>المستندات</h1><div class="sub">${DB.docs.length} مستند</div></div>
    <div class="row"><button class="btn" onclick="exportCSV()">تصدير Excel (CSV)</button><button class="btn primary" onclick="go('edit',{isNew:true,type:'invoice'})">＋ فاتورة جديدة</button></div></div>
    ${backupBanner()}
    <div class="card"><div class="row" style="margin-bottom:14px">
      <div class="seg" id="fType"><button data-v="all">الكل</button><button data-v="invoice">الفواتير</button><button data-v="quote">عروض الأسعار</button></div>
      <select id="fStatus" style="width:auto"><option value="all">كل الحالات</option>${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
      <input class="search" id="fQ" placeholder="بحث: رقم، عميل، فعالية…" value="${esc(docFilter.q)}"></div>
      <div id="docList"></div></div>`;
  const draw=()=>{
    $$('#fType button').forEach(b=>b.classList.toggle('on',b.dataset.v===docFilter.type));
    $('#fStatus').value=docFilter.status;
    const q=docFilter.q.trim().toLowerCase();
    const list=DB.docs.filter(d=>(docFilter.type==='all'||d.type===docFilter.type)&&(docFilter.status==='all'||docStatus(d)===docFilter.status)
      &&(!q||[d.number,d.client?.name,d.event].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt);
    $('#docList').innerHTML=docTable(list,false);
  };
  $$('#fType button').forEach(b=>b.onclick=()=>{docFilter.type=b.dataset.v;draw()});
  $('#fStatus').onchange=e=>{docFilter.status=e.target.value;draw()};
  $('#fQ').oninput=e=>{docFilter.q=e.target.value;draw()};
  draw();
}

/* ---------- EDITOR ---------- */
function newDoc(type){
  const s=S(), d=today();
  return {id:null,type,number:'',date:d,due:addDays(d,type==='invoice'?s.dueDays:s.quoteValidDays),clientId:'',client:{},event:'',eventDate:'',
    items:[{desc:'',qty:1,price:0}],discount:0,vatRate:s.vatRate,notes:type==='invoice'?s.invTerms:s.quoteTerms,
    status:type==='invoice'?'unpaid':'pending',ref:'',createdAt:Date.now()};
}
function nextNumber(type){
  const s=S(), y=new Date().getFullYear();
  const n = type==='invoice' ? s.nextInv : s.nextQuote;
  return (type==='invoice'?s.invPrefix:s.quotePrefix)+y+'-'+String(n).padStart(4,'0');
}

    doc.number=$('#e_number').value.trim(); doc.date=$('#e_date').value; doc.due=$('#e_due').value;
    doc.event=$('#e_event').value; doc.eventDate=$('#e_eventDate').value;
    doc.discount=+$('#e_discount').value||0; doc.vatRate=+$('#e_vat').value||0; doc.status=$('#e_status').value; doc.notes=$('#e_notes').value;
    doc.client={name:$('#c_name').value.trim(),vat:$('#c_vat').value.trim(),cr:$('#c_cr').value.trim(),phone:$('#c_phone').value.trim(),address:$('#c_address').value.trim()};
  };
  const refresh=()=>{
    readForm(); const c=calc(doc);
    $('#tmini').innerHTML=`<div><span class="muted">المجموع</span><span class="num">${money(c.sub)}</span></div>
      ${c.disc?`<div><span class="muted">الخصم</span><span class="num">- ${money(c.disc)}</span></div>`:''}
      <div><span class="muted">الضريبة ${doc.vatRate}%</span><span class="num">${money(c.vat)}</span></div>
      <div class="grand"><span>الإجمالي</span><span class="num">${money(c.total)} ر.س</span></div>`;
    $('#preview').innerHTML=renderPaper(doc);
  };
  drawItems(); refresh();
  $$('.editor input:not([data-k]), .editor textarea:not([data-k]), .editor select:not(#e_clientPick)').forEach(el=>el.addEventListener('input',refresh));
  $('#e_clientPick').onchange=e=>{ const c=DB.clients.find(x=>x.id===e.target.value); doc.clientId=c?c.id:'';
    ['name','vat','cr','phone','address'].forEach(k=>$('#c_'+k).value=c?(c[k]||''):''); refresh(); };
  $('#e_date').addEventListener('change',()=>{ if(isNew) { $('#e_due').value=addDays($('#e_date').value, isInv?S().dueDays:S().quoteValidDays); refresh(); }});
  $('#addItem').onclick=()=>{ doc.items.push({desc:'',qty:1,price:0}); drawItems(); refresh(); $$('#items textarea').at(-1).focus(); };

  const persist=()=>{
    readForm();
    if(!doc.number){ toast('أدخل رقم المستند'); return false; }
    if(DB.docs.some(d=>d.number===doc.number && d.id!==doc.id)){ toast('⚠️ هذا الرقم مستخدم لمستند آخر'); return false; }
    if(!doc.client.name){ toast('أدخل اسم العميل'); return false; }
    if($('#c_save').checked || (!doc.clientId && !DB.clients.some(c=>c.name===doc.client.name))){
      let c = DB.clients.find(x=>x.id===doc.clientId) || DB.clients.find(x=>x.name===doc.client.name);
      if(!c){ c={id:uid()}; DB.clients.push(c); }
      Object.assign(c, doc.client); doc.clientId=c.id;
    }
    doc.items = doc.items.map(it=>({desc:it.desc, qty:+it.qty||0, price:r2(it.price)}));
    if(!doc.id){
      doc.id=uid(); doc.createdAt=Date.now(); doc.time=new Date().toTimeString().slice(0,8); DB.docs.push(doc);
      if(doc.number===nextNumber(doc.type)){ doc.type==='invoice' ? S().nextInv++ : S().nextQuote++; }
      if(arg.fromQuote){ const q=DB.docs.find(d=>d.id===arg.fromQuote); if(q){ q.status='accepted'; q.invoiceId=doc.id; } }
    } else { DB.docs[DB.docs.findIndex(d=>d.id===doc.id)] = structuredClone(doc); }
    save(); return true;
  };
  $('#saveBtn').onclick=()=>{ if(persist()){ toast('✓ تم الحفظ'); go('edit',{id:doc.id}); } };
  $('#print').onclick=()=>{ readForm(); printDoc(doc); };
  if($('#del')) $('#del').onclick=()=>{ if(confirm('حذف '+doc.number+' نهائيًا؟')){ DB.docs=DB.docs.filter(d=>d.id!==doc.id); save(); toast('تم الحذف'); go('docs'); } };
  if($('#dup')) $('#dup').onclick=()=>{ const c=structuredClone(doc); Object.assign(c,{id:null,number:'',date:today(),due:addDays(today(),isInv?S().dueDays:S().quoteValidDays),status:isInv?'unpaid':'pending',ref:''}); go('edit',{isNew:true,type:doc.type,doc:c}); };
  if($('#toInv')) $('#toInv').onclick=()=>{ if(!persist()) return; const inv=structuredClone(doc); const d=today();
    Object.assign(inv,{id:null,type:'invoice',number:'',date:d,due:addDays(d,S().dueDays),status:'unpaid',ref:doc.number,notes:S().invTerms});
    go('edit',{isNew:true,type:'invoice',doc:inv,fromQuote:doc.id}); };
}

/* ---------- CLIENTS ---------- */
function viewClients(m){
  const stats=id=>{const ds=DB.docs.filter(d=>d.clientId===id&&d.type==='invoice'&&d.status!=='cancelled');return{n:ds.length,total:ds.reduce((a,d)=>a+calc(d).total,0),due:ds.filter(d=>d.status==='unpaid').reduce((a,d)=>a+calc(d).total,0)}};
  m.innerHTML=`<div class="page-head"><div><h1>العملاء</h1><div class="sub">${DB.clients.length} عميل</div></div><button class="btn primary" onclick="editClient()">＋ عميل جديد</button></div>
    <div class="card">${DB.clients.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>العميل</th><th>الرقم الضريبي</th><th>الجوال</th><th>فواتير</th><th>إجمالي التعامل</th><th>مستحق</th></tr></thead><tbody>
    ${DB.clients.map(c=>{const s=stats(c.id);return`<tr class="click" onclick="editClient('${c.id}')"><td style="font-weight:700">${esc(c.name)}</td><td class="num">${esc(c.vat)||'—'}</td><td class="num">${esc(c.phone)||'—'}</td><td class="num">${s.n}</td><td class="num">${money(s.total)}</td><td class="num" style="color:${s.due?'var(--warn)':'inherit'}">${money(s.due)}</td></tr>`}).join('')}
    </tbody></table></div>`:`<div class="empty">لا يوجد عملاء بعد — يُضاف العميل تلقائيًا عند حفظ أول فاتورة له.</div>`}</div>`;
}
function editClient(id){
  const c = id ? DB.clients.find(x=>x.id===id) : {id:null,name:'',vat:'',cr:'',phone:'',address:'',email:''};
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h2>${id?'تعديل عميل':'عميل جديد'}</h2>
    <div class="grid2"><label class="f">الاسم<input data-k="name" value="${esc(c.name)}"></label><label class="f">الرقم الضريبي<input data-k="vat" class="ltr" value="${esc(c.vat)}"></label>
    <label class="f">السجل التجاري<input data-k="cr" class="ltr" value="${esc(c.cr)}"></label><label class="f">الجوال<input data-k="phone" class="ltr" value="${esc(c.phone)}"></label>
    <label class="f">البريد<input data-k="email" class="ltr" value="${esc(c.email)}"></label><label class="f">العنوان<input data-k="address" value="${esc(c.address)}"></label></div>
    <div class="row" style="margin-top:18px;justify-content:space-between"><div>${id?'<button class="btn danger" data-a="del">حذف</button>':''}</div>
    <div class="row">${id?'<button class="btn" data-a="inv">فاتورة لهذا العميل</button>':''}<button class="btn ghost" data-a="x">إلغاء</button><button class="btn primary" data-a="save">حفظ</button></div></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.onclick=e=>{ if(e.target===bg) close(); const a=e.target.dataset?.a; if(!a) return;
    if(a==='x') close();
    if(a==='save'){ const v={}; $$('[data-k]',bg).forEach(i=>v[i.dataset.k]=i.value.trim()); if(!v.name){toast('أدخل الاسم');return;}
      if(id) Object.assign(c,v); else DB.clients.push({id:uid(),...v}); save(); close(); go('clients'); }
    if(a==='del'){ if(confirm('حذف العميل؟ الفواتير السابقة تبقى كما هي.')){ DB.clients=DB.clients.filter(x=>x.id!==id); save(); close(); go('clients'); } }
    if(a==='inv'){ close(); const d=newDoc('invoice'); d.clientId=c.id; d.client={...c}; go('edit',{isNew:true,type:'invoice',doc:d}); }
  };
}

/* ---------- SETTINGS ---------- */
function viewSettings(m){
  const s=S();
  const f=(k,label,cls='')=>`<label class="f">${label}<input data-s="${k}" class="${cls}" value="${esc(s[k])}"></label>`;
  m.innerHTML=`<div class="page-head"><div><h1>الإعدادات</h1><div class="sub">تظهر هذه البيانات على كل فاتورة</div></div><button class="btn primary" id="sSave">حفظ الإعدادات</button></div>
    <div class="card"><h2>هوية المنشأة</h2>
      <div class="row" style="margin-bottom:14px;gap:16px"><div class="logo-prev" id="logoPrev">${s.logo?`<img src="${s.logo}">`:'<span style="color:#999;font-size:12px">لا يوجد شعار</span>'}</div>
        <div class="row"><label class="btn sm">رفع الشعار<input type="file" accept="image/*" id="logoIn" hidden></label>${s.logo?'<button class="btn sm danger" id="logoDel">إزالة</button>':''}</div>
        <div class="sub" style="max-width:280px">يفضّل شعار بخلفية شفافة/بيضاء (PNG). يُحفظ داخل الأداة ويعمل بدون إنترنت.</div></div>
      <div class="grid2">${f('nameAr','الاسم بالعربي')}${f('nameEn','الاسم بالإنجليزي','ltr')}
        ${f('vatNo','الرقم الضريبي (15 رقم)','ltr')}${f('crNo','السجل التجاري','ltr')}
        ${f('addressAr','العنوان بالعربي')}${f('addressEn','العنوان بالإنجليزي','ltr')}
        ${f('phone','الهاتف','ltr')}${f('email','البريد','ltr')}${f('website','الموقع','ltr')}</div></div>
    <div class="card"><h2>الحساب البنكي</h2><div class="grid3">${f('accountName','اسم صاحب الحساب')}${f('bank','اسم البنك')}${f('iban','IBAN','ltr')}</div></div>
    <div class="card"><h2>الترقيم والضريبة</h2><div class="grid3">
      ${f('invPrefix','بادئة الفواتير','ltr')}<label class="f">رقم الفاتورة التالي<input type="number" min="1" data-s="nextInv" value="${s.nextInv}"></label><label class="f">نسبة الضريبة الافتراضية %<input type="number" data-s="vatRate" value="${s.vatRate}"></label>
      ${f('quotePrefix','بادئة عروض الأسعار','ltr')}<label class="f">رقم العرض التالي<input type="number" min="1" data-s="nextQuote" value="${s.nextQuote}"></label><label class="f">مهلة السداد (أيام)<input type="number" data-s="dueDays" value="${s.dueDays}"></label>
    </div><div class="sub" style="margin-top:10px">مثال الرقم القادم: <b class="ltr">${esc(nextNumber('invoice'))}</b> · عند إدخال الرقم الضريبي تظهر الفاتورة كـ«فاتورة ضريبية» مع رمز QR متوافق مع هيئة الزكاة (المرحلة الأولى).</div></div>
    <div class="card"><h2>الشروط الافتراضية</h2><div class="grid2">
      <label class="f">شروط الفاتورة<textarea data-s="invTerms" rows="4">${esc(s.invTerms)}</textarea></label>
      <label class="f">شروط عرض السعر<textarea data-s="quoteTerms" rows="4">${esc(s.quoteTerms)}</textarea></label></div></div>
    <div class="card"><h2>النسخ الاحتياطي</h2>
      <p class="sub" style="margin-bottom:14px">البيانات محفوظة داخل هذا المتصفح على هذا الجهاز فقط. خذ نسخة احتياطية أسبوعيًا واحفظها في مكان آمن (فلاش، إيميل، iCloud…). يمكنك استعادتها على أي جهاز.</p>
      <div class="row"><button class="btn neon" onclick="exportBackup()">⬇ تنزيل نسخة احتياطية</button>
        <label class="btn">⬆ استعادة من نسخة<input type="file" accept=".json,application/json" id="restoreIn" hidden></label>
        <button class="btn" onclick="exportCSV()">تصدير الفواتير CSV</button>
        <button class="btn danger" id="wipe" style="margin-inline-start:auto">مسح كل البيانات</button></div></div>`;
  $('#sSave').onclick=()=>{ $$('[data-s]').forEach(i=>{ const k=i.dataset.s; s[k]= i.type==='number' ? (+i.value||0) : i.value; }); save(); toast('✓ تم حفظ الإعدادات'); go('settings'); };
  $('#logoIn').onchange=e=>{ const file=e.target.files[0]; if(!file) return; shrinkImage(file, 600, url=>{ s.logo=url; save(); toast('✓ تم رفع الشعار'); go('settings'); }); };
  if($('#logoDel')) $('#logoDel').onclick=()=>{ s.logo=''; save(); go('settings'); };
  $('#restoreIn').onchange=e=>restoreBackup(e.target.files[0]);
  $('#wipe').onclick=()=>{ if(prompt('سيتم حذف كل الفواتير والعملاء. اكتب "حذف" للتأكيد')==='حذف'){ localStorage.removeItem(KEY); DB=load(); toast('تم المسح'); go('dash'); } };
}
function shrinkImage(file,max,cb){
  const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const k=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL('image/png')); }; img.src=fr.result; }; fr.readAsDataURL(file);
}

/* ---------- BACKUP / EXPORT ---------- */
function download(name, content, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportBackup(){
  DB.lastBackup=Date.now(); save();
  download(`eyal-invoices-backup-${today()}.json`, JSON.stringify({app:'eyal-invoices',version:1,exportedAt:new Date().toISOString(),data:DB},null,1),'application/json');
  toast('✓ تم تنزيل النسخة الاحتياطية'); updateBackupLabel();
}
function restoreBackup(file){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{ try{ const j=JSON.parse(fr.result); const d=j.data||j; if(!d.settings||!Array.isArray(d.docs)) throw 0;
      if(!confirm(`استعادة ${d.docs.length} مستند و ${d.clients?.length||0} عميل؟ سيتم استبدال البيانات الحالية.`)) return;
      DB={settings:{...DEFAULT_SETTINGS,...d.settings},clients:d.clients||[],docs:d.docs,lastBackup:d.lastBackup||Date.now()}; save(); toast('✓ تمت الاستعادة'); go('dash');
    }catch(e){ toast('⚠️ ملف غير صالح'); } };
  fr.readAsText(file);
}
function exportCSV(){
  const rows=[['Number','Type','Date','Due','Client','Client VAT','Event','Subtotal','Discount','Taxable','VAT','Total','Status']];
  DB.docs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(d=>{const c=calc(d);rows.push([d.number,d.type,d.date,d.due,d.client?.name,d.client?.vat,d.event,c.sub,c.disc,c.taxable,c.vat,c.total,docStatus(d)])});
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(`eyal-invoices-${today()}.csv`,csv,'text/csv;charset=utf-8');
}

go('dash');
</script>
</body>
